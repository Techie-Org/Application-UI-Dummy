name: Create PRs for Downstream Sync (epic/pod-development)

on:
  schedule:
    - cron: '15 * * * *'     # Runs daily at 2AM UTC
  workflow_dispatch:          #Allows manual execution

jobs:
  create-sync-prs:
    runs-on: ubuntu-latest

    steps:
      - name: Chekout Repository
        uses: actions/checkout@v4     #Fetched the repository code

      - name: Get subscribed branches and create PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SECRET_PERSONAL_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headBranch = "development";   // Source branch

            // Retrieve open issues with the 'downstream-sync' label
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "downstream-sync",
              per_page: 100,
            });

            if (issues.data.length === 0) {
              console.log("No matching issues found. Exiting.", { issues, gitHubIssues: github.rest.issues, owner, repo, contextRepo: context.repo });
              return;
            }

            let subscribedBranches = issues.data.map(issue => ({
              branch: issue.title,
              labels: issue.labels.map(label => label.name)
            }));

            // Filter branches that start with "epic/" or "pod-development/"
            let filteredBranches = subscribedBranches.filter(issue => 
              issue.branch.startsWith("epic/") || issue.branch.startsWith("pod-development/")
            );

            if (filteredBranches.length === 0) {
              console.log("No branches match the required prefixes. Exiting.");
              return;
            }
            
            console.log("Filtered Branches: ", filteredBranches.map(issue => issue.branch));

            for (const { branch, labels } of filteredBranches) {
              console.log(`Checking PRs for base: ${branch}, head: ${headBranch}`);

              //Check if a PR already exists with the exact base and head
              const existingPRs = await github.rest.pulls.list({
                owner,
                repo,
                state: open,
                base: branch    // Check if base matches the target branch
              });

              const existingMatchingPR = existingPRs.data.find(pr => pr.head.ref === headBranch);

              if (existingMatchingPR) {
                console.log(`PR already exists for ${branch} (PR #${existingMatchingPR.number}). Skipping.`);
                continue;
              }

              // Check if there are any commits between development and the target branch
              try {
                const compare = await github.rest.repos.compareCommits({
                  owner,
                  repo,
                  base: branch,   // Target branch
                  head: headBranch,   // Source branch (development)
                });

                if (compare.data.commits.length === 0) {
                  console.log(`No new commits to merge from ${headBranch} to ${branch}. Skipping the PR creation.`);
                  continue;
                }
              } catch(error) {
                console.log(`Error comparing branches ${headBranch} -> ${branch}:`, error.message);
                continue;
              }

              // Create a new pull request
              const pr = await github.rest.pulls.create({
                owner,
                repo,
                title: `Sync development -> ${branch}`,
                head: headBranch,     // Set head to 'development'
                base: branch,         // Set base to the target branch
                body: `Automated PR to sync development into ${branch}`
              });

              console.log(`PR created for ${branch}: ${pr.data.html_url}`);

              // Add labels from the issue and default labels to the PR
              const prLables = [...new Set([...labels, "automerge", "downstream"])];
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.data.number,
                labels: prLabels,
              });

              console.log(`Labels added to the PR #${pr.data.number}: ${prLabels.join(", ")}`);
            }
